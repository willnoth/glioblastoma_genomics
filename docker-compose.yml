services:
  app:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    container_name: glioblastoma_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./web:/var/www
    # Automatically ensures required framework folders exist and permissions are set at container start
    command: >
      sh -c "mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R 775 storage bootstrap/cache
      && php-fpm"
    depends_on:
      - db
    networks:
      - glioblastoma_net

  webserver:
    image: nginx:alpine
    container_name: glioblastoma_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - glioblastoma_net

  db:
    image: postgres:15-alpine
    container_name: glioblastoma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-glioblastoma}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - glioblastoma_net

networks:
  glioblastoma_net:
    driver: bridge

volumes:
  postgres_data:
